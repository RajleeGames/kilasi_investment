<style>
  :root{
    --tr-primary:#2563eb;
    --tr-primary-dark:#1d4ed8;
    --tr-primary-soft:#eff6ff;

    --tr-text:#0f172a;
    --tr-text-soft:#334155;
    --tr-muted:#64748b;
    --tr-muted-light:#94a3b8;

    --tr-line:#e2e8f0;
    --tr-line-soft:#eef2f7;
    --tr-soft:#f8fafc;
    --tr-white:#ffffff;

    --tr-success:#16a34a;
    --tr-warning:#f59e0b;
    --tr-danger:#dc2626;

    --tr-radius:11px;
    --tr-radius-sm:8px;
    --tr-shadow:0 4px 14px rgba(15,23,42,.045);
  }

  /* =====================================================
     PAGE SHELLS
  ===================================================== */

  .tr-shell{
    width:100%;
    max-width:1380px;
    margin:0 auto;
  }

  .tr-shell-sm{
    width:100%;
    max-width:820px;
    margin:0 auto;
  }

  .tr-shell-md{
    width:100%;
    max-width:1040px;
    margin:0 auto;
  }

  /* =====================================================
     PAGE HEADER
  ===================================================== */

  .tr-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }

  .tr-title{
    margin:0;
    color:var(--tr-text);
    font-size:1.05rem;
    font-weight:800;
    line-height:1.25;
    letter-spacing:-.015em;
  }

  .tr-sub{
    margin-top:3px;
    color:var(--tr-muted);
    font-size:.72rem;
    line-height:1.45;
  }

  .tr-muted{
    color:var(--tr-muted);
  }

  .tr-mono{
    font-family:
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      "Liberation Mono",
      "Courier New",
      monospace;
  }

  /* =====================================================
     CARDS
  ===================================================== */

  .tr-card{
    overflow:hidden;
    background:var(--tr-white);
    border:1px solid rgba(15,23,42,.075);
    border-radius:var(--tr-radius);
    box-shadow:var(--tr-shadow);
  }

  .tr-card-pad{
    padding:11px;
  }

  .tr-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    padding:10px 11px;
    background:#fbfdff;
    border-bottom:1px solid var(--tr-line-soft);
  }

  .tr-card-title{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0;
    color:var(--tr-text);
    font-size:.77rem;
    font-weight:800;
    line-height:1.3;
  }

  /* =====================================================
     KPI CARDS
  ===================================================== */

  .tr-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
  }

  .tr-kpi{
    padding:11px;
  }

  .tr-kpi-label{
    color:var(--tr-muted);
    font-size:.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .tr-kpi-value{
    margin-top:3px;
    color:var(--tr-text);
    font-size:1.12rem;
    font-weight:800;
    line-height:1.2;
  }

  .tr-kpi-note{
    margin-top:2px;
    color:var(--tr-muted-light);
    font-size:.62rem;
    line-height:1.35;
  }

  /* =====================================================
     BUTTONS
  ===================================================== */

  .tr-actions{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }

  .tr-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    min-height:32px;
    padding:5px 9px;

    border:1px solid transparent;
    border-radius:var(--tr-radius-sm);

    background:none;
    color:inherit;

    font-family:inherit;
    font-size:.68rem;
    font-weight:750;
    line-height:1.15;
    text-align:center;
    text-decoration:none;
    white-space:nowrap;

    cursor:pointer;
    transition:
      background-color .14s ease,
      border-color .14s ease,
      color .14s ease,
      box-shadow .14s ease;
  }

  .tr-btn i{
    font-size:.69rem;
  }

  .tr-btn:hover{
    text-decoration:none;
  }

  .tr-btn:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(37,99,235,.11);
  }

  .tr-btn-primary{
    background:var(--tr-primary);
    border-color:var(--tr-primary);
    color:#fff;
  }

  .tr-btn-primary:hover{
    background:var(--tr-primary-dark);
    border-color:var(--tr-primary-dark);
    color:#fff;
  }

  .tr-btn-soft{
    background:var(--tr-primary-soft);
    border-color:#dbeafe;
    color:var(--tr-primary-dark);
  }

  .tr-btn-soft:hover{
    background:#dbeafe;
    color:var(--tr-primary-dark);
  }

  .tr-btn-success{
    background:var(--tr-success);
    border-color:var(--tr-success);
    color:#fff;
  }

  .tr-btn-success:hover{
    background:#15803d;
    border-color:#15803d;
    color:#fff;
  }

  .tr-btn-warning{
    background:var(--tr-warning);
    border-color:var(--tr-warning);
    color:#fff;
  }

  .tr-btn-warning:hover{
    background:#d97706;
    border-color:#d97706;
    color:#fff;
  }

  .tr-btn-danger{
    background:var(--tr-danger);
    border-color:var(--tr-danger);
    color:#fff;
  }

  .tr-btn-danger:hover{
    background:#b91c1c;
    border-color:#b91c1c;
    color:#fff;
  }

  .tr-btn-muted{
    background:#fff;
    border-color:var(--tr-line);
    color:var(--tr-text-soft);
  }

  .tr-btn-muted:hover{
    background:var(--tr-soft);
    border-color:#cbd5e1;
    color:var(--tr-text);
  }

  .tr-btn-sm{
    min-height:27px;
    padding:4px 7px;
    border-radius:7px;
    font-size:.62rem;
  }

  .tr-btn-sm i{
    font-size:.62rem;
  }

  /* =====================================================
     TABLES
  ===================================================== */

  .tr-table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  .tr-table{
    width:100%;
    min-width:880px;
    margin:0;
    border-collapse:collapse;
  }

  .tr-table th{
    padding:8px 9px;
    background:var(--tr-soft);
    border-bottom:1px solid var(--tr-line);

    color:#475569;
    font-size:.59rem;
    font-weight:800;
    text-align:left;
    text-transform:uppercase;
    letter-spacing:.045em;
    white-space:nowrap;
  }

  .tr-table td{
    padding:8px 9px;
    border-bottom:1px solid var(--tr-line-soft);

    color:#1e293b;
    font-size:.69rem;
    line-height:1.4;
    vertical-align:middle;
  }

  .tr-table tbody tr{
    transition:background-color .12s ease;
  }

  .tr-table tbody tr:hover{
    background:#fbfdff;
  }

  .tr-table tbody tr:last-child td{
    border-bottom:0;
  }

  .tr-table strong{
    font-size:.7rem;
  }

  .tr-table small{
    color:var(--tr-muted);
    font-size:.62rem;
  }

  /* =====================================================
     BADGES
  ===================================================== */

  .tr-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:4px;

    min-height:22px;
    padding:3px 7px;

    border-radius:999px;

    font-size:.58rem;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
  }

  .tr-badge i{
    font-size:.58rem;
  }

  .tr-pending{
    background:#fff7ed;
    color:#c2410c;
  }

  .tr-in_transit{
    background:#eff6ff;
    color:#1d4ed8;
  }

  .tr-completed{
    background:#ecfdf5;
    color:#047857;
  }

  .tr-cancelled{
    background:#fef2f2;
    color:#b91c1c;
  }

  .tr-active{
    background:#ecfdf5;
    color:#047857;
  }

  .tr-inactive{
    background:#f1f5f9;
    color:#475569;
  }

  /* =====================================================
     FILTERS
  ===================================================== */

  .tr-filter{
    display:grid;
    grid-template-columns:
      minmax(180px,2fr)
      repeat(5,minmax(115px,1fr));
    align-items:end;
    gap:7px;
  }

  .tr-filter-4{
    grid-template-columns:
      minmax(180px,2fr)
      repeat(3,minmax(125px,1fr));
  }

  .tr-field{
    min-width:0;
  }

  .tr-field label,
  .tr-form-group label{
    display:block;
    margin:0 0 4px;

    color:#475569;
    font-size:.63rem;
    font-weight:800;
    line-height:1.25;
  }

  .tr-field .form-control,
  .tr-field .form-select,
  .tr-form-group .form-control,
  .tr-form-group .form-select,
  .tr-form-group input:not([type="checkbox"]):not([type="radio"]),
  .tr-form-group select,
  .tr-form-group textarea{
    width:100%;
    min-height:34px;
    padding:5px 8px;

    border:1px solid #dbe3ec;
    border-radius:8px;

    background-color:#fff;
    color:var(--tr-text);

    font-family:inherit;
    font-size:.68rem;
    line-height:1.3;

    box-shadow:none;
    transition:
      border-color .14s ease,
      box-shadow .14s ease;
  }

  .tr-field .form-control:focus,
  .tr-field .form-select:focus,
  .tr-form-group .form-control:focus,
  .tr-form-group .form-select:focus,
  .tr-form-group input:focus,
  .tr-form-group select:focus,
  .tr-form-group textarea:focus{
    outline:none;
    border-color:rgba(37,99,235,.45);
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
  }

  /* =====================================================
     FORMS
  ===================================================== */

  .tr-form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .tr-form-group{
    min-width:0;
  }

  .tr-form-group.full{
    grid-column:1 / -1;
  }

  .tr-form-group textarea.form-control,
  .tr-form-group textarea{
    min-height:78px;
    resize:vertical;
  }

  .tr-form-group input[type="file"]{
    padding:5px;
  }

  .tr-error{
    margin-top:3px;
    color:var(--tr-danger);
    font-size:.61rem;
    font-weight:700;
    line-height:1.35;
  }

  .tr-help{
    margin-top:3px;
    color:var(--tr-muted);
    font-size:.6rem;
    line-height:1.4;
  }

  .tr-alert{
    margin-bottom:10px;
    padding:8px 9px;

    border:1px solid rgba(220,38,38,.16);
    border-radius:8px;

    background:#fef2f2;
    color:#b91c1c;

    font-size:.66rem;
    font-weight:700;
    line-height:1.45;
  }

  .tr-note{
    padding:8px 9px;

    border:1px solid var(--tr-line);
    border-radius:8px;

    background:var(--tr-soft);
    color:var(--tr-muted);

    font-size:.64rem;
    line-height:1.45;
  }

  .tr-info{
    padding:8px 9px;

    border:1px solid #dbeafe;
    border-radius:8px;

    background:#eff6ff;
    color:#1e40af;

    font-size:.65rem;
    line-height:1.45;
  }

  /* =====================================================
     CHECKBOX
  ===================================================== */

  .tr-check{
    display:flex;
    align-items:center;
    gap:7px;

    min-height:35px;
    padding:7px 9px;

    border:1px solid var(--tr-line);
    border-radius:8px;

    background:var(--tr-soft);
  }

  .tr-check input{
    width:15px!important;
    height:15px!important;
    min-height:15px!important;
    margin:0!important;
    padding:0!important;
    flex:0 0 auto;
  }

  .tr-check label{
    margin:0!important;

    color:var(--tr-text-soft)!important;
    font-size:.67rem!important;
    font-weight:700!important;
    text-transform:none!important;
    letter-spacing:0!important;
  }

  /* =====================================================
     EMPTY STATE
  ===================================================== */

  .tr-empty{
    padding:24px 12px;
    color:var(--tr-muted);
    font-size:.7rem;
    line-height:1.5;
    text-align:center;
  }

  .tr-empty i{
    display:block;
    margin-bottom:6px;
    color:var(--tr-muted-light);
    font-size:1.05rem;
  }

  /* =====================================================
     DETAIL CARDS
  ===================================================== */

  .tr-detail-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }

  .tr-detail-item{
    min-width:0;
    padding:9px;

    border:1px solid var(--tr-line-soft);
    border-radius:8px;

    background:var(--tr-soft);
  }

  .tr-detail-label{
    color:var(--tr-muted);
    font-size:.58rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.045em;
  }

  .tr-detail-value{
    margin-top:3px;

    color:var(--tr-text);
    font-size:.7rem;
    font-weight:700;
    line-height:1.4;
    word-break:break-word;
  }

  /* =====================================================
     PAGINATION
  ===================================================== */

  .tr-pagination{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    padding:9px 11px;
    border-top:1px solid var(--tr-line-soft);
  }

  .tr-page-links{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
  }

  .tr-page-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-width:30px;
    height:30px;
    padding:0 7px;

    border:1px solid var(--tr-line);
    border-radius:7px;

    background:#fff;
    color:var(--tr-text-soft);

    font-size:.64rem;
    font-weight:800;
    text-decoration:none;
  }

  .tr-page-link:hover{
    background:var(--tr-primary-soft);
    border-color:#bfdbfe;
    color:var(--tr-primary-dark);
  }

  .tr-page-link.active{
    background:var(--tr-primary);
    border-color:var(--tr-primary);
    color:#fff;
  }

  .tr-page-link.disabled{
    pointer-events:none;
    background:var(--tr-soft);
    color:var(--tr-muted-light);
  }

  /* =====================================================
     SMS
  ===================================================== */

  .tr-sms-ok{
    color:#047857;
    font-size:.64rem;
    font-weight:750;
  }

  .tr-sms-fail{
    color:#b91c1c;
    font-size:.64rem;
    font-weight:750;
  }

  .tr-sms-wait{
    color:var(--tr-muted);
    font-size:.64rem;
    font-weight:750;
  }

  .tr-code-list{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
  }

  .tr-code{
    padding:3px 6px;

    border:1px solid var(--tr-line);
    border-radius:6px;

    background:#f1f5f9;
    color:var(--tr-text-soft);

    font-size:.61rem;
  }

  /* =====================================================
     DRIVER CARDS
  ===================================================== */

  .tr-driver-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
    gap:9px;
  }

  .tr-driver-card{
    display:flex;
    flex-direction:column;
    gap:8px;

    padding:10px;

    border:1px solid rgba(15,23,42,.07);
    border-radius:10px;

    background:#fff;
    box-shadow:0 3px 10px rgba(2,6,23,.04);

    transition:
      border-color .14s ease,
      box-shadow .14s ease;
  }

  .tr-driver-card:hover{
    border-color:rgba(37,99,235,.18);
    box-shadow:0 6px 16px rgba(2,6,23,.07);
  }

  .tr-driver-main{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .tr-avatar{
    display:grid;
    place-items:center;
    overflow:hidden;
    flex:0 0 auto;

    width:46px;
    height:46px;

    border:1px solid rgba(15,23,42,.07);
    border-radius:10px;

    background:#eef2f7;
    color:var(--tr-text-soft);

    font-size:.8rem;
    font-weight:800;
  }

  .tr-avatar img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .tr-driver-name{
    color:var(--tr-text);
    font-size:.73rem;
    font-weight:800;
    line-height:1.3;
  }

  .tr-driver-meta{
    display:flex;
    flex-direction:column;
    gap:2px;

    margin-top:3px;

    color:var(--tr-muted);
    font-size:.62rem;
    line-height:1.4;
  }

  .tr-vehicle-pill{
    display:flex;
    align-items:center;
    gap:6px;

    padding:6px 8px;

    border:1px solid #dbeafe;
    border-radius:8px;

    background:var(--tr-primary-soft);
    color:var(--tr-primary-dark);

    font-size:.63rem;
    font-weight:800;
  }

  .tr-vehicle-pill.off{
    background:#f1f5f9;
    border-color:var(--tr-line);
    color:#475569;
  }

  /* =====================================================
     PHOTO FIELD
  ===================================================== */

  .tr-photo-wrap{
    display:flex;
    align-items:flex-start;
    gap:9px;
  }

  .tr-photo-preview{
    display:grid;
    place-items:center;
    overflow:hidden;
    flex:0 0 auto;

    width:72px;
    height:72px;

    border:1px dashed rgba(15,23,42,.18);
    border-radius:10px;

    background:#f3f6f9;
    cursor:pointer;
  }

  .tr-photo-preview img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .tr-photo-preview i{
    color:var(--tr-muted-light);
    font-size:.9rem;
  }

  /* =====================================================
     MOBILE ACTION BAR
  ===================================================== */

  .tr-mobile-actions{
    display:none;
  }

  /* =====================================================
     TABLET
  ===================================================== */

  @media(max-width:1200px){
    .tr-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .tr-filter{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }
  }

  /* =====================================================
     RESPONSIVE TABLE
  ===================================================== */

  @media(max-width:991.98px){
    .tr-responsive-table{
      min-width:0;
      background:transparent;
    }

    .tr-responsive-table thead{
      display:none;
    }

    .tr-responsive-table,
    .tr-responsive-table tbody,
    .tr-responsive-table tr,
    .tr-responsive-table td{
      display:block;
      width:100%;
    }

    .tr-responsive-table tbody{
      display:grid;
      gap:8px;
      padding:8px;
    }

    .tr-responsive-table tbody tr{
      overflow:hidden;

      padding:3px 0;

      border:1px solid var(--tr-line);
      border-radius:9px;

      background:#fff;
      box-shadow:0 2px 8px rgba(15,23,42,.035);
    }

    .tr-responsive-table tbody td{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;

      padding:6px 8px;

      border:0;
      border-bottom:1px solid #f1f5f9;

      font-size:.66rem;
      text-align:right;
    }

    .tr-responsive-table tbody td:last-child{
      border-bottom:0;
    }

    .tr-responsive-table tbody td::before{
      content:attr(data-label);

      min-width:82px;

      color:var(--tr-muted);
      font-size:.57rem;
      font-weight:800;
      text-align:left;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .tr-responsive-table tbody td.tr-mobile-full{
      display:block;
      text-align:left;
    }

    .tr-responsive-table tbody td.tr-mobile-full::before{
      display:block;
      margin-bottom:5px;
    }
  }

  /* =====================================================
     MOBILE
  ===================================================== */

  @media(max-width:800px){
    .tr-shell,
    .tr-shell-sm,
    .tr-shell-md{
      width:100%;
      max-width:100%;
    }

    .tr-head{
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }

    .tr-title{
      font-size:.94rem;
    }

    .tr-sub{
      font-size:.66rem;
    }

    .tr-grid,
    .tr-form-grid,
    .tr-detail-grid,
    .tr-filter,
    .tr-filter-4{
      grid-template-columns:1fr;
    }

    .tr-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px;
    }

    .tr-kpi{
      padding:9px;
    }

    .tr-kpi-value{
      font-size:1rem;
    }

    .tr-actions{
      width:100%;
      gap:5px;
    }

    .tr-actions > .tr-btn{
      flex:1 1 auto;
    }

    .tr-card-pad{
      padding:9px;
    }

    .tr-card-head{
      padding:9px;
    }

    .tr-photo-wrap{
      flex-direction:column;
    }

    .tr-pagination{
      flex-direction:column;
      align-items:stretch;
      padding:8px;
    }

    .tr-page-links{
      justify-content:center;
    }

    .tr-driver-grid{
      grid-template-columns:1fr;
      gap:7px;
    }
  }

  @media(max-width:767.98px){
    body.tr-has-mobile-actions{
      padding-bottom:72px;
    }

    .tr-desktop-actions{
      display:none!important;
    }

    .tr-mobile-actions{
      position:fixed;
